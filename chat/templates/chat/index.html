<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
</head>
<body>
<h1>Chat Room: {{ room_name }}</h1>
<input type="text" id="messageInput">
<button id="sendButton">Send</button>

<div id="messages"></div>

<script>
    const roomName = "{{ room_name }}";
    const socket = new WebSocket("ws://" + window.location.host + "/ws/chat/" + roomName + "/");

    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    socket.onopen = function() {console.log("WebSocket connected");};
    socket.onmessage = function(event) {
        const data = JSON.parse(event.data);

        if (data.reason === "history") {
            const messages = document.getElementById("messages");
            data.messages.forEach(function(message){
                const messageElement = document.createElement("p");
                messageElement.textContent = message.username + ": " + message.message;
                messages.appendChild(messageElement);
            });
        }

        if (data.reason === "message"){
            const messages = document.getElementById("messages");
            const messageElement = document.createElement("p");
            messageElement.textContent = data.username + ": " + data.message;
            messages.appendChild(messageElement);
        }

        if (data.reason === "user_joined"){
            console.log(data.username + " joined the room");
        }

        if (data.reason === "user_left"){
            console.log(data.username + " left the room");
        }

    };
    socket.onclose = function() {console.log("WebSocket disconnected");};

    sendButton.addEventListener("click", function(){
        const message = messageInput.value;
        socket.send(JSON.stringify({message:message}));
    });
</script>
</body>
</html>
